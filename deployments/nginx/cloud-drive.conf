server {
    listen 443 ssl http2;
    server_name drive.example.org;
    client_max_body_size 100m;
    location / { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
    location /static/ { alias /opt/cloud-drive/web/static/; add_header Cache-Control "public, max-age=604800"; }
}
