root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/cloud-drive.exe ./cmd/server"
  bin = "tmp/cloud-drive.exe"
  delay = 500
  exclude_dir = ["assets", "bin", "storage", "tmp", ".git"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "html", "css", "js"]
  kill_delay = "500ms"
  log = "air-build.log"
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = true

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
